apiVersion: skaffold/v4beta13
kind: Config
manifests:
  rawYaml:
    - ./infra/k8s/*
build:
  local:
    push: false
  artifacts:
    - image: chriscrossington/auth
      context: auth
      docker:
        dockerfile: dockerfile
      sync:
        manual:
        - src: "src/***/*.ts"
          dest: .
    - image: chriscrossington/client
      context: client
      docker:
        dockerfile: dockerfile
      sync:
        manual:
        - src: "***/*.ts"
          dest: .
    - image: chriscrossington/tickets
      context: tickets
      docker:
        dockerfile: dockerfile
      sync:
        manual:
        - src: "src/***/*.ts"
          dest: .
    - image: chriscrossington/orders
      context: orders
      docker:
        dockerfile: dockerfile
      sync:
        manual:
        - src: "src/***/*.ts"
          dest: .